# OpenSLO v1: https://openslo.com/specification/
# Метрики задают требуемое инструментирование; окно 30 дней — скользящее.
# Считать прирост counters с обработкой сбросов до суммирования экземпляров.
# Нет метрик — сбой мониторинга; нулевой знаменатель — нет наблюдений, не успех.
# Пустые исходы экспортируются нулями. Аннотации не создают правила Alertmanager.
# HAProxy/API учитывают каждую команду один раз, включая timeout и перегрузку.
# Каждая допустимая попытка попадает в evaluated_total ровно через 60 с от готовности,
# включая pending; успешна только при технически корректном результате в срок.
# Поздние ответы не исправляют нарушение; повторы HTTP/webhook не создают попыток.
# Списания и возвраты разделены operation. Нулевые дубли и RTO/RPO в аннотациях —
# обязательные инварианты для отдельных проверок, без допуска из бюджета ошибок.
apiVersion: openslo/v1
kind: SLO
metadata:
  annotations:
    duplicate-charges: 0 повторных списаний из-за повторов команды; любое событие
      — инцидент.
    on-breach: Немедленная эскалация backend-2; неопределённый платёж остаётся pending
      до сверки; повторное списание блокируется.
    recovery: При отказе одной площадки RTO ≤120 с; RPO подтверждённых записей =0.
    sla: Приём команды 99.99%; финансовых компенсаций нет.
    source: payments.md
  displayName: 'Платежи: приём команды за ≤2 с'
  labels:
    owner:
    - backend-2
  name: payments-command-acceptance
spec:
  budgetingMethod: Occurrences
  description: 'Намерение и outbox записаны за ≤2 с / все валидные команды. Повтор
    с тем же idempotency key возвращает тот же сохранённый результат и не создаёт
    новое списание. Перегрузка и timeout — ошибки. Плановые работы включены. Источники:
    API и outbox.'
  indicator:
    metadata:
      name: payments-command-acceptance-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            spec:
              query: payment_commands_total{valid="true",outcome="persisted-within-2s"}
            type: Prometheus
        total:
          metricSource:
            spec:
              query: payment_commands_total{valid="true"}
            type: Prometheus
  objectives:
  - target: 0.9999
  service: payments
  timeWindow:
  - duration: 30d
    isRolling: true
---
apiVersion: openslo/v1
kind: SLO
metadata:
  annotations:
    source: payments.md
  displayName: 'Платежи: результат партнёра — списания'
  labels:
    owner:
    - backend-2
  name: payments-partner-charge
spec:
  budgetingMethod: Occurrences
  description: 'Технически корректный итог партнёра за ≤60 с / попытки, готовые
    к исполнению после действий пользователя. Корректный отказ банка считается обработанной
    попыткой. Предварительная цель; списания и возвраты измеряются раздельно. Источники:
    проверенные webhooks и сверка партнёра; плановые работы учитываются.'
  indicator:
    metadata:
      name: payments-partner-charge-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            spec:
              query: payment_attempts_evaluated_total{operation="charge",outcome="technical-result-within-60s"}
            type: Prometheus
        total:
          metricSource:
            spec:
              query: payment_attempts_evaluated_total{operation="charge"}
            type: Prometheus
  objectives:
  - target: 0.999
  service: payments
  timeWindow:
  - duration: 30d
    isRolling: true
---
apiVersion: openslo/v1
kind: SLO
metadata:
  annotations:
    source: payments.md
  displayName: 'Платежи: результат партнёра — возвраты'
  labels:
    owner:
    - backend-2
  name: payments-partner-refund
spec:
  budgetingMethod: Occurrences
  description: 'Технически корректный итог партнёра за ≤60 с / попытки, готовые
    к исполнению после действий пользователя. Корректный отказ банка считается обработанной
    попыткой. Предварительная цель; списания и возвраты измеряются раздельно. Источники:
    проверенные webhooks и сверка партнёра; плановые работы учитываются.'
  indicator:
    metadata:
      name: payments-partner-refund-sli
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            spec:
              query: payment_attempts_evaluated_total{operation="refund",outcome="technical-result-within-60s"}
            type: Prometheus
        total:
          metricSource:
            spec:
              query: payment_attempts_evaluated_total{operation="refund"}
            type: Prometheus
  objectives:
  - target: 0.999
  service: payments
  timeWindow:
  - duration: 30d
    isRolling: true
